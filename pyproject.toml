[project]
name = "schema-sentinel"
version = "0.1.0"
description = "Self-healing schema validation and test generation for JSON APIs"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "genson>=1.3.0",
    "groq>=0.4.0",
    "ollama>=0.1.7",
    "PyGithub>=2.1.1",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "allure-pytest>=2.13.0",
    "pytest>=7.4.0",
    "deepdiff>=6.7.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]
